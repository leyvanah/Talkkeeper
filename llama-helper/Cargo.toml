[package]
name = "llama-helper"
version = "0.2.12"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
llama-cpp-2 = "=0.1.146"
encoding_rs = "0.8"
# Only for asking ggml what the GPU actually has. Same version llama-cpp-2
# already builds, so it costs no extra compilation and cannot drift from the
# library that ends up doing the offloading.
llama-cpp-sys-2 = { version = "=0.1.146", optional = true }

[features]
default = []
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan", "dep:llama-cpp-sys-2"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"  # Optimize for size for faster loading
